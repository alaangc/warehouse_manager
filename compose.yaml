services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: warehouse_manager
      POSTGRES_USER: warehouse_app
      POSTGRES_PASSWORD: development-only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warehouse_app -d warehouse_manager']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - warehouse-data:/var/lib/postgresql
      - ./database/docker/init-test-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: warehouse_manager_test
      POSTGRES_USER: warehouse_test
      POSTGRES_PASSWORD: test-only
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warehouse_test -d warehouse_manager_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  warehouse-data:
