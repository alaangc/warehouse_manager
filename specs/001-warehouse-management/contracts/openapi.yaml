          in: query
          description: Administrator filter; Drivers may specify only their own identity.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: routeId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Sales visible under the caller's role and resource scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleListResponse'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Sales]
      operationId: confirmSale
      description: >-
        Assigned driver confirms a sale against products in an En Route route. Price,
        totals, sale, sale ticket, movements, and idempotency result commit atomically.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
