components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-wm_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Per-session synchronizer token for an authenticated unsafe request
      schema:
        type: string
        minLength: 32
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key scoped to actor and operation; reuse requires identical content
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CashCloseId:
      name: cashCloseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PeriodFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    PeriodTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time

  responses:
    Problem:
      description: RFC 9457 error; exact status and stable code identify the failure
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
    Quantity:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
      examples: ['12.500']
    PositiveQuantity:
      type: string
      pattern: '^(0\.00[1-9]|0\.0[1-9][0-9]?|0\.[1-9][0-9]{0,2}|[1-9][0-9]*(\.[0-9]{1,3})?)$'
      examples: ['1', '12.500']
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
      examples: ['1250.00']
    NonnegativeMoney:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
      examples: ['1250.00']
    UnitPrice:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
      examples: ['12.3450']
    UserRole:
      type: string
      enum: [ADMINISTRATOR, DRIVER]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, instance]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]+$'
        instance:
          type: string
        fieldErrors:
          type: array
          items:
