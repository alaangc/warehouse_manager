openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Warehouse Manager API
  version: 1.0.0
  description: >-
    Authoritative HTTP contract for warehouse, route, sale, reconciliation, reporting,
    document, user, and printer-profile operations. Money and quantities are decimal
    strings. All protected authorization and business rules are enforced by the API.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Users
  - name: Catalog
  - name: Customers
  - name: Inventory
  - name: Routes
  - name: Sales
  - name: Cash closes
  - name: Reports
  - name: Documents
  - name: Printers
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is ready to serve requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
        '503':
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session; sets the secure session cookie
          headers:
            X-CSRF-Token:
              description: Synchronizer token for subsequent unsafe requests
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      responses:
        '200':
          description: Current authenticated session
          headers:
            X-CSRF-Token:
              description: Current synchronizer token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /overview:
    get:
      operationId: getRoleOverview
      responses:
        '200':
          description: Role-filtered operational overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Problem'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Users visible to an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Users]
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Users]
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated, activated, or deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /locations:
    get:
      tags: [Catalog]
      operationId: listLocations
      responses:
        '200':
          description: Stock-holding branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
    post:
      tags: [Catalog]
      operationId: createLocation
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationWriteRequest'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      responses:
        '200':
          description: Product categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
    post:
      tags: [Catalog]
      operationId: createCategory
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /units:
    get:
      tags: [Catalog]
      operationId: listUnits
      responses:
        '200':
          description: Product units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListResponse'
    post:
      tags: [Catalog]
      operationId: createUnit
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitWriteRequest'
      responses:
        '201':
          description: Unit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Products visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      tags: [Catalog]
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Catalog]
      operationId: getProduct
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Catalog]
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated, activated, or archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Customers with fields filtered by caller role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
    post:
      tags: [Customers]
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWriteRequest'
      responses:
        '201':
          description: Customer created by an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      responses:
        '200':
          description: Customer detail filtered by role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Customer updated, activated, or archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /customers/{customerId}/prices:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: listCustomerPrices
      responses:
        '200':
          description: Customer-specific product price history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPriceListResponse'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Customers]
      operationId: createCustomerPrice
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPriceWriteRequest'
      responses:
        '201':
          description: Customer-specific price created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPriceResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /customers/{customerId}/sales:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Customers]
      operationId: listCustomerSales
      responses:
        '200':
          description: Customer purchase history; administrators only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleListResponse'
        '403':
          $ref: '#/components/responses/Problem'

  /vehicles:
    get:
      tags: [Catalog]
      operationId: listVehicles
      responses:
        '200':
          description: Delivery vehicles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
    post:
      tags: [Catalog]
      operationId: createVehicle
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleWriteRequest'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /printer-profiles:
    get:
      tags: [Printers]
      operationId: listPrinterProfiles
      responses:
        '200':
          description: Approved printer profiles available to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterProfileListResponse'
    post:
      tags: [Printers]
      operationId: createPrinterProfile
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterProfileWriteRequest'
      responses:
        '201':
          description: Approved printer profile created by an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterProfileResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me/printer-preference:
    get:
      tags: [Printers]
      operationId: getMyPrinterPreference
      responses:
        '200':
          description: Current user's limited printer preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterPreferenceResponse'
    put:
      tags: [Printers]
      operationId: setMyPrinterPreference
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterPreferenceRequest'
      responses:
        '200':
          description: Preference saved; physical permission remains browser-local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterPreferenceResponse'
        '422':
          $ref: '#/components/responses/Problem'

  /inventory/balances:
    get:
      tags: [Inventory]
      operationId: listInventoryBalances
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: productId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: branchId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: routeId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: alertsOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Role-filtered current balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBalanceListResponse'
        '403':
          $ref: '#/components/responses/Problem'

  /inventory/movements:
    get:
      tags: [Inventory]
      operationId: listInventoryMovements
      description: >-
        Administrators may query all permitted inventory movements. Drivers may query
        movements only for routes assigned to them, including Returned and Closed
        routes; branch-wide, general-inventory, and unrelated-route movements are
        forbidden. Query parameters never broaden the authenticated caller's scope.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: productId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: branchId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: routeId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: operationType
          in: query
          schema:
            $ref: '#/components/schemas/InventoryOperationType'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Role-scoped traceable inventory movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovementListResponse'
        '403':
          $ref: '#/components/responses/Problem'

  /inventory/operations:
    post:
      tags: [Inventory]
      operationId: createInventoryOperation
      description: >-
        Administrator-only entry, manual exit, or positive/negative adjustment.
        Transfers use the dedicated endpoint.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryOperationRequest'
      responses:
        '201':
          description: Operation and all movements committed atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOperationResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /inventory/transfers:
    post:
      tags: [Inventory]
      operationId: createInventoryTransfer
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransferRequest'
      responses:
        '201':
          description: Full transfer committed or no changes made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOperationResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /inventory/operations/{operationId}/reversal:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      tags: [Inventory]
      operationId: reverseInventoryOperation
      description: >-
        Appends an administrator-authorized compensating operation and movements;
        never edits the original operation or ledger rows.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '201':
          description: Compensating operation committed atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOperationResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      description: >-
        Administrators may list all routes. Drivers receive every route assigned to
        them, including Returned and Closed history. A Driver-provided filter cannot
        expand visibility to another Driver's routes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/RouteState'
        - name: driverId
          in: query
          description: Administrator filter; Drivers may specify only their own identity.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: businessDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Routes visible under the caller's role and resource scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Routes]
      operationId: createRoute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreateRequest'
      responses:
        '201':
          description: Preparing route created and assigned by an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      tags: [Routes]
      operationId: getRoute
      description: >-
        Administrators may retrieve any route. Drivers may retrieve only routes
        assigned to them, in any state; another Driver's route is forbidden.
      responses:
        '200':
          description: Route with load, balances, movements, sales, return, reconciliation, and closure history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetailResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}/load:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    put:
      tags: [Routes]
      operationId: replaceRouteLoadDraft
      description: Assigned driver records the complete draft load while route is Preparing.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteLoadDraftRequest'
      responses:
        '200':
          description: Draft load replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteLoadResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}/load/confirmation:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    post:
      tags: [Routes]
      operationId: confirmRouteLoad
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
      responses:
        '200':
          description: Full load moved from branch to temporary route inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetailResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}/start:
