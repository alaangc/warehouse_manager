openapi: 3.1.0
info:
  title: Warehouse Manager API
  version: 1.0.0
  description: Authoritative v1 contract. Money is represented by decimal strings.
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /auth/session:
    post:
      security: []
      operationId: createSession
      responses: { '200': { description: Authenticated }, '401': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteSession
      responses: { '204': { description: Revoked } }
  /me:
    get:
      operationId: getCurrentUser
      responses: { '200': { description: User and role overview } }
  /products:
    get: { operationId: listProducts, responses: { '200': { description: Products } } }
    post: { operationId: createProduct, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Error' } } }
  /products/{productId}:
    get:
      operationId: getProductInventoryDetail
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Product catalog data, inventory summary, per-holder balances, and recent movements }
        '404': { $ref: '#/components/responses/Error' }
  /customers:
    get: { operationId: listCustomers, responses: { '200': { description: Role-filtered customers } } }
    post: { operationId: createCustomer, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Error' } } }
  /inventory/balances:
    get: { operationId: listInventoryBalances, responses: { '200': { description: Holder balances } } }
  /inventory/movements:
    get: { operationId: listInventoryMovements, responses: { '200': { description: Immutable history } } }
  /inventory/adjustments:
    post:
      operationId: createInventoryAdjustment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Committed }, '409': { $ref: '#/components/responses/Error' } }
  /inventory/transfers:
    post:
      operationId: createInventoryTransfer
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Linked movements committed }, '409': { $ref: '#/components/responses/Error' } }
  /routes:
    get: { operationId: listRoutes, responses: { '200': { description: Role-filtered routes } } }
    post: { operationId: createRoute, responses: { '201': { description: PREPARING route }, '409': { $ref: '#/components/responses/Error' } } }
  /routes/{routeId}/load-confirmations:
    post:
      operationId: confirmRouteLoad
      parameters: [{ $ref: '#/components/parameters/RouteId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Loaded atomically }, '409': { $ref: '#/components/responses/Error' } }
  /routes/{routeId}/start:
    post:
      operationId: startRoute
      parameters: [{ $ref: '#/components/parameters/RouteId' }]
      responses: { '200': { description: EN_ROUTE }, '409': { $ref: '#/components/responses/Error' } }
  /routes/{routeId}/return:
    post:
      operationId: returnRoute
      parameters: [{ $ref: '#/components/parameters/RouteId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: RETURNED }, '409': { $ref: '#/components/responses/Error' } }
  /routes/{routeId}/reconciliation:
    post:
      operationId: reconcileRoute
      parameters: [{ $ref: '#/components/parameters/RouteId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Returns and differences committed }, '409': { $ref: '#/components/responses/Error' } }
  /routes/{routeId}/close:
    post:
      operationId: closeRoute
      parameters: [{ $ref: '#/components/parameters/RouteId' }]
      responses: { '200': { description: CLOSED }, '409': { $ref: '#/components/responses/Error' } }
  /sales:
    post:
      operationId: confirmSale
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaleConfirmation' } } }
      responses: { '201': { description: Sale, movements and ticket committed }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /sales/{saleId}/cancellation:
    post:
      operationId: cancelSale
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Compensated once }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /cash-closes:
    post: { operationId: createCashClose, responses: { '201': { description: Reproducible close saved } } }
  /reports/operations:
    get:
      operationId: getOperationsReport
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: Business-timezone report } }
  /documents:
    post: { operationId: createDocumentOutput, responses: { '202': { description: Output attempt accepted } } }
  /documents/{documentId}/retry:
    post:
      operationId: retryDocumentOutput
      parameters: [{ name: documentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: Output-only retry accepted } }
components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: wm_session }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    RouteId: { name: routeId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Stable error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    DecimalQuantity: { type: string, pattern: '^[0-9]+(\.[0-9]{1,3})?$' }
    SaleConfirmation:
      type: object
      required: [customerId, routeId, paymentMethod, lines]
      properties:
        customerId: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [CASH, BANK_TRANSFER, CARD] }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/DecimalQuantity' }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: array, items: { type: object, additionalProperties: true } }
