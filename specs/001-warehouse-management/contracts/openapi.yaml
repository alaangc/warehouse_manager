      tags: [Routes]
      operationId: startRoute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
      responses:
        '200':
          description: Assigned driver moved route from Preparing to En Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}/return:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    post:
      tags: [Routes]
      operationId: returnRoute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
      responses:
        '200':
          description: Assigned driver moved route from En Route to Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}/reconciliation:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    put:
      tags: [Routes]
      operationId: approveRouteReconciliation
      description: >-
        Administrator records physical returns, provides mandatory reasons for
        differences, creates adjustments, and returns stock to the origin atomically.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteReconciliationRequest'
      responses:
        '200':
          description: Reconciliation approved and temporary route inventory is zero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteReconciliationResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /routes/{routeId}/close:
