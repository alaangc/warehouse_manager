  /sales:
    get:
      tags: [Sales]
      operationId: listSales
      description: >-
        Administrators may list all sales. Drivers receive only sales attributed to
        their authenticated identity, including preserved cancellation status. A
        Driver-provided filter cannot expand visibility to another Driver's sales.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: customerId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
